<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rueda Nocturna</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 flex items-center justify-center min-h-screen p-6">

  <main class="max-w-xl w-full bg-slate-800 p-8 rounded-2xl border border-slate-700 space-y-6">
    
    <span class="inline-block bg-emerald-500/10 text-emerald-400 font-semibold text-xs tracking-wider uppercase px-3 py-1 rounded-full border border-emerald-500/20">
      Nuevo - Jueves a sábado
    </span>

    <div class="space-y-2">
      <h1 class="text-3xl font-bold text-white tracking-tight leading-tight">
        Rueda Nocturna
      </h1>
      <p class="text-slate-400 text-base leading-relaxed">
        Descubre Medellín en bici cuando se encienden las luces
      </p>
    </div>

    <div class="flex items-center space-x-6 border-y border-slate-700/60 py-4">
      <div>
        <p class="text-xs uppercase tracking-wider text-slate-400">Recorrido</p>
        <p class="text-lg font-semibold text-slate-200">3 rutas</p>
      </div>
      <div class="h-8 w-px bg-slate-700"></div>
      <div>
        <p class="text-xs uppercase tracking-wider text-slate-400">Precio</p>
        <p class="text-lg font-semibold text-emerald-400">Desde $55.000</p>
      </div>
    </div>

    <div>
      <a href="#" class="inline-block w-full text-center bg-emerald-500 text-slate-950 font-bold px-6 py-3 rounded-xl hover:bg-emerald-400 transition-colors uppercase tracking-wider text-sm">
        Inscríbete
      </a>
    </div>

  </main>

</body>
</html>
